; PlatformIO project for the NeuroDrive vehicle firmware.
;
; The sources live in neurodrive_firmware/ so the exact same folder opens
; directly in the Arduino IDE. There is no duplicated copy of the code.
;
;   pio run                 build
;   pio run -t upload       flash the board
;   pio device monitor      serial monitor at 115200
;
; Arduino IDE users: open neurodrive_firmware/neurodrive_firmware.ino,
; select "ESP32 Dev Module", and upload. See README.md.

[platformio]
src_dir = neurodrive_firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Wall

; Uncomment if the board resets on upload without entering bootloader mode.
; upload_speed = 115200
